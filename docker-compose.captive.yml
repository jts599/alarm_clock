version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
      - "80:80"  # Redirect HTTP to frontend
    environment:
      - REACT_APP_API_URL=http://192.168.4.1:5000
      - REACT_APP_ENV=captive_portal
      - REACT_APP_MODE=wifi_setup
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./shared:/app/shared
      - ./raspberry-pi:/app/raspberry-pi
    environment:
      - ASPNETCORE_ENVIRONMENT=CaptivePortal
      - ASPNETCORE_URLS=http://+:5000
      - WIFI_INTERFACE=wlan0
    restart: unless-stopped

networks:
  default:
    driver: bridge
