version: "3.8"

# Development/staging configuration for dev branch
# Use with: docker-compose -f docker-compose.dev.yml up -d

services:
  frontend:
    image: ${DOCKER_USERNAME:-jts599}/alarm-clock-frontend:dev
    container_name: alarm-clock-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /opt/alarm-clock/background-custom.jpg:/usr/share/nginx/html/assets/background-custom.jpg:ro

  backend:
    image: ${DOCKER_USERNAME:-jts599}/alarm-clock-backend:dev
    container_name: alarm-clock-backend
    privileged: true
    network_mode: host
    volumes:
      - ./shared:/app/shared
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /sys/class/backlight:/sys/class/backlight
      - /opt/alarm-clock/background-custom.jpg:/app/background-custom.jpg:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - TZ=${TZ:-UTC}
      - Weather__Longitude=${WEATHER_LONGITUDE:--74.0060}
      - Weather__Latitude=${WEATHER_LATITUDE:-40.7128}
      - RunConfiguration__StubLifx=${STUB_LIFX:-false}
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: --interval 300 --cleanup

networks:
  default:
    driver: bridge
