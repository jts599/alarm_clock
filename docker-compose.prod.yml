version: "3.8"

# Production configuration for main branch
# Use with: docker-compose -f docker-compose.prod.yml up -d

services:
  # Model downloader - runs once to ensure models exist
  model-init:
    image: curlimages/curl:latest
    volumes:
      - models-data:/models
    command: >
      sh -c "
        if [ ! -f /models/tinyllama-1.1b-chat.onnx ]; then
          echo 'Downloading TinyLlama model...';
          curl -L -o /models/tinyllama-1.1b-chat.onnx 
            'https://huggingface.co/microsoft/TinyLlama-1.1B-Chat-v1.0-onnx/resolve/main/model.onnx' ||
          curl -L -o /models/tinyllama-1.1b-chat.onnx 
            'https://huggingface.co/TinyLlama/TinyLlama-1.1B-Chat-v1.0/resolve/main/pytorch_model.bin';
          echo 'Model downloaded successfully';
        else
          echo 'Model already exists, skipping download';
        fi
      "
    restart: "no"

  frontend:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/alarm-clock-frontend:latest
    container_name: alarm-clock-frontend
    ports:
      - "3000:80"
    depends_on:
      model-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  backend:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/alarm-clock-backend:latest
    container_name: alarm-clock-backend
    ports:
      - "5000:5000"
    volumes:
      - ./shared:/app/shared
      - models-data:/app/models
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - Llm__ModelPath=/app/models/tinyllama-1.1b-chat.onnx
      - Llm__EnableLlm=true
      - Weather__Longitude=${WEATHER_LONGITUDE:--74.0060}
      - Weather__Latitude=${WEATHER_LATITUDE:-40.7128}
      - RunConfiguration__StubLifx=${STUB_LIFX:-false}
      - RunConfiguration__FastTimescale=${FAST_TIMESCALE:-false}
    depends_on:
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: --interval 300 --cleanup

volumes:
  models-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alarm-clock/models

networks:
  default:
    driver: bridge
